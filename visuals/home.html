<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="topnav">
    <a style="float: left" href="/">Home</a>
    <a style="float: left" href="/recommendations">Recommendations</a>
    <input type="search" name="search" placeholder="Search">
    <a href="/user_profile">User Profile</a>
    <a href="/wishlist">Wishlist</a>
    <a href="/cart">Cart</a>
</div>
<div class="page-content">
    <table id="rec_table" style="width:25%; margin-left: auto; margin-right: auto;">
        {% for product in products %}
        <tr>
            <td><img src="{{url_for('assets', path='/' ~ product.img_path)}}" alt="" height=200 width=300></td>
            <td>
                <div style="vertical-align: top; text-align: left">{{product.name}}</div>
                <div style="text-align: left; white-space: pre-line; float: left">
                    Short Description:
                    {{product.short_description}}
                </div>
            </td>
            <td>
                <div style="vertical-align: top; text-align: left">Price: {{product.price}}</div>
            </td>
            <td>
                <a href="/products/{{product.id}}">Go to page</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <a href="/logout">Logout</a>
</div>
</body>
</html>
