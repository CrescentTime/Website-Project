<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
<h1>Login</h1>
<form action="/login" method="post">
    <label>Username:</label>
    <input type="text" name="username" id="username" required><br><br>
    <label>Password:</label>
    <input type="text" name="password" id="password" required><br><br>
    <button type="submit">Login</button>
</form>
<button onclick="open_reset_password()">Reset Password</button>
<div id="reset_password_form" class="popup-form">
    <form action="/reset_password" method="get" class="form-container">
        Enter your username and a reset password link will be sent to the registered email address.<br><br>
        <label>Username:</label>
        <input type="text" name="username" id="username_reset" required><br><br>
        <button type="submit">Submit Request</button>
    </form>
</div>
<script src="assets/js/reset_password.js"></script>
</body>
</html>
