<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
<h1>Login</h1>
<form action="/login" method="post" id="login_form">
    <label>Username:</label>
    <input type="text" name="username" id="username" required><br><br>
    <label>Password:</label>
    <input type="password" name="password" id="password" required><br><br>
    <button type="submit">Login</button>
</form>
<p id="login_error"></p>
<button onclick="open_reset_password()">Reset Password</button>
<div id="reset_password_div" class="popup-form">
    <form action="/reset_password" method="get" class="form-container" id="reset_password_form">
        Enter your username and a reset password link will be sent to the registered email address.<br><br>
        <label>Username:</label>
        <input type="text" name="username" id="username_reset" required><br><br>
        <button type="submit">Submit Request</button>
    </form>
    <pre id="reset_message"></pre>
</div>
<script src="assets/js/login.js"></script>
</body>
</html>
