<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wishlist</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="topnav">
    <a style="float: left" href="/">Home</a>
    <a style="float: left" href="/recommendations">Recommendations</a>
    <input type="search" name="search" placeholder="Search">
    <a href="/user_profile">User Profile</a>
    <a href="/wishlist">Wishlist</a>
    <a href="/cart">Cart</a>
</div>
<div class="page-content">

    <table style="width:25%; margin-left: auto; margin-right: auto;">
        {% for w_product in wishlist %}
        <tr>
            <td><img src="{{url_for('assets', path='/' ~ w_product.img_path)}}" alt="" height=200 width=300></td>
            <td>
                <div style="vertical-align: top; text-align: left">{{w_product.name}}</div>
            </td>
            <td>
                <div style="vertical-align: top; text-align: left">Price: {{w_product.price}}</div>
            </td>
            <td>
                <button type="button" onclick="remove_product('{{w_product.id}}')">Remove</button>
            </td>
        </tr>
        {% endfor %}
    </table>

</div>
<script src="/assets/js/wishlist.js"></script>
</body>
</html>
