<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="topnav">
    <a style="float: left" href="/">Home</a>
    <a style="float: left" href="/recommendations">Recommendations</a>
    <input type="search" name="search" placeholder="Search">
    <a href="/user_profile">User Profile</a>
    <a href="/wishlist">Wishlist</a>
    <a href="/cart">Cart</a>
</div>
<div class="page-content">
    <h2>Welcome, {{user.username}}!</h2>
    <button onclick="go_to_change_password()">Change Password</button><br><br>
    <button onclick="open_username_form()">Change Username</button><br>
    <div id="username_div" class="popup-form">
        <form action="/change_username" method="post" class="form-container" id="username_form">
            Enter your new username.<br><br>
            <label>New Username:</label>
            <input type="text" name="username" id="username" required><br><br>
            <button type="submit">Confirm</button>
        </form>
        <p id="username_message"></p>
    </div>
    <div>
        <h1>Your Purchases</h1>

        <table style="width:25%; margin-left: auto; margin-right: auto;">
            {% for product in purchases %}
            <tr>
                <td><img src="{{url_for('assets', path='/' ~ product.img_path)}}" alt="" height=200 width=300></td>
                <td>
                    <div style="vertical-align: top; text-align: left">{{product.name}}</div>
                    <div style="text-align: left; white-space: pre-line; float: left">
                        Purchase Date: {{product.purchase_date}}
                    </div>
                </td>
            </tr>
            {% for product in purchases %}
        </table>
        {% endfor %}
    </div>
</div>
<script src="/assets/js/user_profile.js"></script>
</body>
</html>
